version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: almonds-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almonds
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for job queues and caching
  redis:
    image: redis:7-alpine
    container_name: almonds-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Almonds Backend API (optional - for local development)
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: almonds-api
  #   restart: always
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/almonds?schema=public
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #   depends_on:
  #     - postgres
  #     - redis
  #   volumes:
  #     - .:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  redis_data:
