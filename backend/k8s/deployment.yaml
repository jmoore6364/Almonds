apiVersion: apps/v1
kind: Deployment
metadata:
  name: almonds-api
  namespace: almonds
  labels:
    app: almonds-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: almonds-api
  template:
    metadata:
      labels:
        app: almonds-api
        version: v1
    spec:
      containers:
      - name: api
        image: almonds/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: almonds-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: almonds-secrets
              key: jwt-secret
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        envFrom:
        - configMapRef:
            name: almonds-config
        - secretRef:
            name: almonds-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: almonds-api-service
  namespace: almonds
spec:
  selector:
    app: almonds-api
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: almonds-config
  namespace: almonds
data:
  CORS_ORIGIN: "https://app.almonds.io"
  FRONTEND_URL: "https://app.almonds.io"
  LOG_LEVEL: "error"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: almonds-api-hpa
  namespace: almonds
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: almonds-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
