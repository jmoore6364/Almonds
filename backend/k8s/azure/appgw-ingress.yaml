# Azure Application Gateway Ingress Configuration
# Requires: Application Gateway Ingress Controller (AGIC) installed
# https://azure.github.io/application-gateway-kubernetes-ingress/

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: almonds-api-appgw
  namespace: default
  labels:
    app: almonds-api
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: azure/application-gateway

    # Health check configuration
    appgw.ingress.kubernetes.io/health-probe-path: /api/v1/health/ready
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-299"
    appgw.ingress.kubernetes.io/health-probe-interval: "15"
    appgw.ingress.kubernetes.io/health-probe-timeout: "5"
    appgw.ingress.kubernetes.io/health-probe-unhealthy-threshold: "3"

    # SSL/TLS configuration
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: "almonds-ssl-cert"

    # Backend protocol
    appgw.ingress.kubernetes.io/backend-protocol: "http"

    # Connection draining
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"

    # Request timeout
    appgw.ingress.kubernetes.io/request-timeout: "60"

    # Cookie affinity
    appgw.ingress.kubernetes.io/cookie-based-affinity: "Enabled"

    # WAF (Web Application Firewall)
    appgw.ingress.kubernetes.io/waf-policy-for-path: "/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/almonds-waf-policy"

spec:
  tls:
    - hosts:
        - api.almonds.io
      secretName: almonds-tls
  rules:
    - host: api.almonds.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: almonds-api
                port:
                  number: 80
