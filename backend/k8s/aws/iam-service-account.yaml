# IAM Role for Service Account (IRSA)
# This allows pods to assume IAM roles for AWS service access
#
# Prerequisites:
# 1. Create IAM role with trust policy for EKS OIDC provider
# 2. Attach required policies to the IAM role
# 3. Annotate the ServiceAccount with the role ARN
#
# Setup:
# eksctl create iamserviceaccount \
#   --name almonds-api \
#   --namespace default \
#   --cluster almonds-cluster \
#   --attach-policy-arn arn:aws:iam::${AWS_ACCOUNT_ID}:policy/AlmondsAPIPolicy \
#   --approve

apiVersion: v1
kind: ServiceAccount
metadata:
  name: almonds-api
  namespace: default
  labels:
    app: almonds-api
  annotations:
    # IAM role ARN that the pod will assume
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/AlmondsAPIRole
---
