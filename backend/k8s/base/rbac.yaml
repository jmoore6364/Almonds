apiVersion: v1
kind: ServiceAccount
metadata:
  name: almonds-api
  labels:
    app: almonds-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: almonds-api
  labels:
    app: almonds-api
rules:
  # Allow reading ConfigMaps for configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow reading Secrets for credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Allow getting pod information
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: almonds-api
  labels:
    app: almonds-api
subjects:
  - kind: ServiceAccount
    name: almonds-api
    namespace: default
roleRef:
  kind: Role
  name: almonds-api
  apiGroup: rbac.authorization.k8s.io
